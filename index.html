<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🥌 플로어 컬링 수행평가 매니저 (플러스마이너스 입력 완벽 반영본)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- Firebase SDK (실시간 데이터 연동) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #0f172a; color: #334155; -webkit-tap-highlight-color: transparent; }
        .btn-chic { transition: all 0.15s ease-in-out; }
        .btn-chic:active { transform: scale(0.96); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex justify-center items-center">
    <div id="app" class="w-full max-w-md bg-white min-h-screen shadow-2xl flex flex-col relative border-x border-slate-100"></div>

    <script>
        // --- 💡 파이어베이스 연결 설정 ---
        const firebaseConfig = {
            databaseURL: "https://ugch-floor-curling-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        
        let dbRef = null;
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            dbRef = firebase.database().ref('UGCH floor curling'); 
        } catch (e) {
            console.error("Firebase 연결 실패:", e);
        }

        const AVATARS = [
            { id: 'cat', name: '고양이', icon: '🐱' },
            { id: 'dog', name: '강아지', icon: '🐶' },
            { id: 'rabbit', name: '토끼', icon: '🐰' },
            { id: 'panda', name: '판다', icon: '🐼' },
            { id: 'fox', name: '여우', icon: '🦊' }
        ];

        const state = {
            view: 'login',
            selectedClass: 1,
            teacherRankClass: 1,       
            teacherRoundRankClass: 1, 
            teacherRoundRankNum: 1,   
            student: null,
            activeTab: 'draw',
            selectedRound: 1,
            teacherSubTab: 'monitor',
            selectedAvatar: 'cat',
            dbData: { classes: {}, unlockedRounds: [true, false, false, false, false], teacherPwd: "0000" }
        };

        // 실시간 데이터 동기화 리스너
        if (dbRef) {
            dbRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    if (data.classes) state.dbData.classes = data.classes;
                    if (data.unlockedRounds && Array.isArray(data.unlockedRounds)) {
                        state.dbData.unlockedRounds = data.unlockedRounds;
                    }
                    if (data.teacherPwd) state.dbData.teacherPwd = data.teacherPwd;
                }
                render();
            });
        }

        function pushDb() {
            if (dbRef && state.dbData && Object.keys(state.dbData).length > 0) {
                dbRef.set(state.dbData);
            }
        }

        // 점수 계산 로직 (-1이면 미입력이므로 점수 계산 안 함)
        function calcDrawScore(c) {
            if (c === undefined || c === null || c < 0) return null; 
            const capped = Math.min(4, c);
            if (capped >= 4) return 40;
            if (capped === 3) return 35;
            if (capped === 2) return 30;
            if (capped === 1) return 25;
            return 20; // 0개 성공 시 기본점수 20점
        }

        function calcGuardScore(c) {
            if (c === undefined || c === null || c < 0) return null; 
            const capped = Math.min(4, c);
            if (capped >= 4) return 40;
            if (capped === 3) return 35;
            if (capped === 2) return 30;
            if (capped === 1) return 25;
            return 20; // 0개 성공 시 기본점수 20점
        }

        function calcTakeoutScore(c) {
            if (c === undefined || c === null || c < 0) return null; 
            const capped = Math.min(3, c);
            if (capped >= 3) return 20; 
            if (capped === 2) return 15; 
            return 10; // 0개 성공 시 기본점수 10점
        }

        function getRoundScore(rData, rIdx) {
            if (!rData || !rData.records) return 0; 
            
            const dVal = rData.records.draw ? rData.records.draw[rIdx] : -1;
            const gVal = rData.records.guard ? rData.records.guard[rIdx] : -1;
            const tVal = rData.records.takeout ? rData.records.takeout[rIdx] : -1;

            const sD = calcDrawScore(dVal);
            const sG = calcGuardScore(gVal);
            const sT = calcTakeoutScore(tVal);

            let total = 0;
            if (sD !== null) total += sD;
            if (sG !== null) total += sG;
            if (sT !== null) total += sT;

            return total;
        }

        function getTotalCumulativeScore(student) {
            if (!student || !student.rounds) return 0;
            let total = 0;
            for (let i = 0; i < 5; i++) {
                const rKey = 'round_' + (i + 1);
                const rData = student.rounds[rKey];
                if (rData) {
                    const hasRecord = rData.records && (
                        (rData.records.draw && rData.records.draw[i] >= 0) ||
                        (rData.records.guard && rData.records.guard[i] >= 0) ||
                        (rData.records.takeout && rData.records.takeout[i] >= 0)
                    );
                    if (rData.approved || rData.submitted || hasRecord) {
                        total += getRoundScore(rData, i);
                    }
                }
            }
            return total;
        }

        function render() {
            const app = document.getElementById('app');
            if (!app) return;
            if (state.view === 'login') app.innerHTML = renderLogin();
            else if (state.view === 'student_main') app.innerHTML = renderStudentMain();
            else if (state.view === 'teacher_main') app.innerHTML = renderTeacherMain();
        }

        function renderLogin() {
            let classStudents = (state.dbData.classes && state.dbData.classes[state.selectedClass]) || [];
            classStudents.sort((a, b) => Number(a.number) - Number(b.number));

            return `
                <div class="p-6 flex flex-col justify-between flex-grow bg-slate-950 text-white min-h-screen">
                    <div class="py-6 text-center">
                        <span class="bg-slate-800 text-teal-400 font-semibold text-xs px-3.5 py-1.5 rounded-full tracking-wide">PHYSICAL EDUCATION</span>
                        <h1 class="text-3xl font-black mt-3 text-slate-100 tracking-tight">🥌 Floor Curling</h1>
                        <p class="text-xs text-slate-400 mt-1.5 font-light">1학년 플로어 컬링 수행평가</p>
                    </div>

                    <div class="bg-slate-900 rounded-2xl p-6 shadow-2xl border border-slate-800 space-y-4">
                        <h2 class="text-base font-bold text-slate-200 tracking-tight">학생 직접 등록 및 캐릭터 선택</h2>
                        
                        <div>
                            <label class="text-[11px] font-medium text-slate-400">학급 선택</label>
                            <select id="select-class" class="w-full mt-1 p-3 bg-slate-800 text-slate-200 border border-slate-700 rounded-xl font-medium focus:outline-none focus:border-teal-400 text-sm" onchange="changeClass(this.value)">
                                ${[1,2,3,4,5,6,7,8,9].map(c => `<option value="${c}" ${c===state.selectedClass?'selected':''}>1학년 ${c}반</option>`).join('')}
                            </select>
                        </div>

                        ${classStudents.length > 0 ? `
                            <div>
                                <label class="text-[11px] font-medium text-slate-400">등록된 명단에서 선택</label>
                                <select class="w-full mt-1 p-3 bg-slate-800 text-slate-200 border border-slate-700 rounded-xl font-medium focus:outline-none focus:border-teal-400 text-sm mb-2" onchange="selectExisting(this.value)">
                                    <option value="">-- 명단에서 선택하기 --</option>
                                    ${classStudents.map(s => `<option value="${s.number}">${s.number}번 ${s.name}</option>`).join('')}
                                </select>
                            </div>
                        ` : ''}

                        <div class="space-y-3 p-3 bg-slate-800/60 rounded-xl border border-slate-700">
                            <span class="text-[11px] font-semibold text-teal-400 block">✨ 내 정보 및 마스코트 설정</span>
                            <div class="grid grid-cols-2 gap-2">
                                <input type="number" id="input-num" placeholder="번호 (예: 12)" class="p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white placeholder-slate-500">
                                <input type="text" id="input-name" placeholder="이름 (예: 홍길동)" class="p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white placeholder-slate-500">
                            </div>

                            <div>
                                <label class="text-[10px] text-slate-400 block mb-1">내 동물 러닝 캐릭터 선택</label>
                                <div class="grid grid-cols-5 gap-1.5">
                                    ${AVATARS.map((av) => `
                                        <button type="button" onclick="selectAvatarIcon('${av.id}')" id="av-btn-${av.id}" class="av-option p-2 rounded-xl bg-slate-900 border flex flex-col items-center justify-center ${state.selectedAvatar===av.id?'border-teal-400 bg-teal-500/10':'border-slate-700'}">
                                            <span class="text-xl">${av.icon}</span>
                                            <span class="text-[9px] text-slate-400 mt-0.5">${av.name}</span>
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        </div>

                        <button onclick="doLogin()" class="btn-chic w-full bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold text-base py-3.5 rounded-xl shadow-lg mt-2">
                            입장 및 연습 시작
                        </button>
                    </div>

                    <div class="text-center py-3">
                        <button onclick="checkTeacherPassword()" class="text-xs text-slate-500 hover:text-teal-400 transition">
                            🔒 교사 관리자 모드 진입
                        </button>
                    </div>
                </div>
            `;
        }

        function changeClass(val) {
            state.selectedClass = Number(val);
            render();
        }

        function selectAvatarIcon(avId) {
            state.selectedAvatar = avId;
            document.querySelectorAll('.av-option').forEach(el => el.classList.remove('border-teal-400', 'bg-teal-500/10'));
            const target = document.getElementById(`av-btn-${avId}`);
            if (target) target.classList.add('border-teal-400', 'bg-teal-500/10');
        }

        function selectExisting(numStr) {
            if (!numStr) return;
            const classStudents = (state.dbData.classes && state.dbData.classes[state.selectedClass]) || [];
            const found = classStudents.find(s => Number(s.number) === Number(numStr));
            if (found) {
                document.getElementById('input-num').value = found.number;
                document.getElementById('input-name').value = found.name;
                if (found.avatar) selectAvatarIcon(found.avatar);
            }
        }

        function checkTeacherPassword() {
            const currentPwd = state.dbData.teacherPwd || "0000";
            const inputPwd = prompt("선생님 전용 비밀번호를 입력하세요. (기본: 0000)");
            if (inputPwd === currentPwd) {
                state.view = 'teacher_main';
                state.teacherSubTab = 'monitor';
                render();
            } else if (inputPwd !== null) {
                alert("비밀번호가 일치하지 않습니다!");
            }
        }

        function doLogin() {
            const num = Number(document.getElementById('input-num').value);
            const name = document.getElementById('input-name').value.trim();
            const avatar = state.selectedAvatar;

            if (!num || !name) {
                alert('본인의 번호와 이름을 정확히 입력해주세요!');
                return;
            }

            if (!state.dbData.classes) state.dbData.classes = {};
            if (!state.dbData.classes[state.selectedClass]) state.dbData.classes[state.selectedClass] = [];

            let classStudents = state.dbData.classes[state.selectedClass];
            let student = classStudents.find(s => Number(s.number) === num);

            if (!student) {
                student = { 
                    number: num, 
                    name: name, 
                    avatar: avatar,
                    rounds: {} 
                };
                classStudents.push(student);
            } else {
                student.name = name;
                student.avatar = avatar;
            }

            classStudents.sort((a, b) => Number(a.number) - Number(b.number));

            state.student = student;
            if (dbRef) {
                dbRef.child('classes/' + state.selectedClass).set(classStudents);
            }
            state.view = 'student_main';
            render();
        }

        function renderStudentMain() {
            const classStudents = (state.dbData.classes && state.dbData.classes[state.selectedClass]) || [];
            const cur = classStudents.find(s => Number(s.number) === Number(state.student.number)) || state.student;
            
            const rKey = 'round_' + state.selectedRound;
            if (!cur.rounds) cur.rounds = {};
            if (!cur.rounds[rKey]) {
                cur.rounds[rKey] = {
                    submitted: false,
                    approved: false,
                    records: { draw: [-1,-1,-1,-1,-1], guard: [-1,-1,-1,-1,-1], takeout: [-1,-1,-1,-1,-1] }
                };
            }
            const rData = cur.rounds[rKey];
            const todayTotal = getRoundScore(rData, state.selectedRound - 1);

            let completedCount = 0;
            for (let i = 0; i < 5; i++) {
                if (rData.records.draw[i] >= 0 || rData.records.guard[i] >= 0 || rData.records.takeout[i] >= 0) {
                    completedCount++;
                }
            }
            const progressPercent = Math.min(100, Math.max(5, (completedCount / 5) * 100));
            const avObj = AVATARS.find(a => a.id === (cur.avatar || 'cat')) || AVATARS[0];

            return `
                <div class="flex flex-col flex-grow bg-slate-50 min-h-screen">
                    <div class="bg-slate-900 p-5 text-white border-b border-slate-800 space-y-3">
                        <div class="flex justify-between items-end">
                            <div>
                                <span class="text-[11px] text-teal-400 font-semibold tracking-wider">1학년 ${state.selectedClass}반 ${cur.number}번</span>
                                <h2 class="text-xl font-bold mt-0.5 text-slate-100">${avObj.icon} ${cur.name}</h2>
                            </div>
                            <div class="text-right">
                                <div class="text-[10px] text-slate-400 font-medium">${state.selectedRound}차시 오늘 합계 점수</div>
                                <div class="text-3xl font-black text-teal-400 tracking-tight">${todayTotal}<span class="text-sm font-normal text-slate-400 ml-0.5">점</span></div>
                            </div>
                        </div>

                        <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700/60 space-y-1.5">
                            <div class="flex justify-between text-[10px] font-semibold text-slate-400">
                                <span>🚩 START</span>
                                <span class="text-teal-400">${state.selectedRound}차시 달성률 (${completedCount}/5 완료)</span>
                                <span>🏁 FINISH</span>
                            </div>
                            <div class="relative w-full h-7 bg-slate-900 rounded-full overflow-hidden border border-slate-700">
                                <div class="absolute top-0 left-0 h-full bg-gradient-to-r from-teal-500/20 to-teal-500/50 transition-all duration-500" style="width: ${progressPercent}%;"></div>
                                <div class="absolute top-0 h-full flex items-center transition-all duration-500 text-lg" style="left: calc(${progressPercent}% - 14px);">
                                    ${avObj.icon}
                                </div>
                            </div>
                        </div>

                        <div class="pt-1 flex justify-between items-center text-xs">
                            <span class="text-slate-400 text-[11px]">${state.selectedRound}차시 승인 상태:</span>
                            ${rData.approved 
                                ? `<span class="bg-teal-500/20 text-teal-300 font-bold px-2.5 py-0.5 rounded-md border border-teal-500/40 text-[11px]">✅ 선생님 승인 완료</span>` 
                                : (rData.submitted 
                                    ? `<span class="bg-sky-500/20 text-sky-300 font-bold px-2.5 py-0.5 rounded-md border border-sky-500/40 text-[11px]">⏳ 선생님 확인 대기 중</span>`
                                    : `<span class="bg-amber-500/20 text-amber-300 font-bold px-2.5 py-0.5 rounded-md border border-amber-500/40 text-[11px]">✍️ ${state.selectedRound}차시 과제 수행 중</span>`)
                            }
                        </div>
                    </div>

                    <div class="flex p-1 bg-white m-3 mb-2 rounded-xl shadow-sm border border-slate-200/80 text-[10px] font-semibold text-center overflow-x-auto">
                        <button onclick="state.activeTab='draw'; render();" class="flex-1 py-2 px-1 rounded-lg transition min-w-[45px] ${state.activeTab==='draw'?'bg-slate-900 text-white font-bold':'text-slate-500 hover:text-slate-900'}">🎯드로우</button>
                        <button onclick="state.activeTab='guard'; render();" class="flex-1 py-2 px-1 rounded-lg transition min-w-[45px] ${state.activeTab==='guard'?'bg-slate-900 text-white font-bold':'text-slate-500 hover:text-slate-900'}">🛡️가드</button>
                        <button onclick="state.activeTab='takeout'; render();" class="flex-1 py-2 px-1 rounded-lg transition min-w-[50px] ${state.activeTab==='takeout'?'bg-slate-900 text-white font-bold':'text-slate-500 hover:text-slate-900'}">💥테이크</button>
                        <button onclick="state.activeTab='guide'; render();" class="flex-1 py-2 px-1 rounded-lg transition min-w-[50px] ${state.activeTab==='guide'?'bg-slate-900 text-white font-bold':'text-slate-500 hover:text-slate-900'}">📊기준</button>
                        <button onclick="state.activeTab='rank'; render();" class="flex-1 py-2 px-1 rounded-lg transition min-w-[50px] ${state.activeTab==='rank'?'bg-teal-500 text-slate-950 font-bold':'text-slate-500 hover:text-slate-900'}">🏆전교30</button>
                        <button onclick="state.activeTab='classRank'; render();" class="flex-1 py-2 px-1 rounded-lg transition min-w-[55px] ${state.activeTab==='classRank'?'bg-sky-500 text-slate-950 font-bold':'text-slate-500 hover:text-slate-900'}">🏫반별순위</button>
                        <button onclick="state.activeTab='reward'; render();" class="flex-1 py-2 px-1 rounded-lg transition min-w-[45px] ${state.activeTab==='reward'?'bg-amber-400 text-slate-950 font-bold':'text-slate-500 hover:text-slate-900'}">🎁상품</button>
                    </div>

                    <div class="p-4 flex-grow flex flex-col justify-between">
                        ${state.activeTab==='rank' ? renderRank() : (state.activeTab==='classRank' ? renderClassRank() : (state.activeTab==='reward' ? renderRewardTab() : (state.activeTab==='guide' ? renderGuideTab() : renderPractice(cur, rData))))}
                    </div>
                </div>
            `;
        }

        function renderGuideTab() {
            return `
                <div class="space-y-4 max-h-[460px] overflow-y-auto pr-0.5 text-left">
                    <div class="text-center">
                        <h3 class="text-base font-bold text-slate-900 tracking-tight">📊 미니 컬링 세부 평가 채점표</h3>
                        <p class="text-[11px] text-slate-400">수행평가 공식 채점 기준입니다.</p>
                    </div>

                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                            <span class="font-bold text-xs text-slate-900">📌 평가 항목 및 기본점수</span>
                            <span class="text-[10px] bg-teal-50 text-teal-700 font-bold px-2 py-0.5 rounded border border-teal-200">기본점수 부여</span>
                        </div>

                        <div class="border border-slate-200 rounded-xl overflow-hidden">
                            <div class="bg-slate-900 text-white px-3 py-2 text-xs font-bold flex justify-between items-center">
                                <span>🎯 드로우 영역 (40점 만점 / 기본 20점)</span>
                            </div>
                            <div class="p-2 bg-slate-50 text-[11px] space-y-1">
                                <div class="flex justify-between p-1 bg-white rounded"><span>A등급 : 4개 안착</span><span class="font-bold text-teal-600">40점</span></div>
                                <div class="flex justify-between p-1 bg-white rounded"><span>B등급 : 3개 안착</span><span class="font-bold text-slate-700">35점</span></div>
                                <div class="flex justify-between p-1 bg-white rounded"><span>C등급 : 2개 안착</span><span class="font-bold text-slate-700">30점</span></div>
                                <div class="flex justify-between p-1 bg-white rounded"><span>D등급 : 1개 안착</span><span class="font-bold text-slate-700">25점</span></div>
                                <div class="flex justify-between p-1 bg-white rounded"><span>E등급 : 0개 성공 (기본)</span><span class="font-bold text-slate-400">20점</span></div>
                            </div>
                        </div>

                        <div class="border border-slate-200 rounded-xl overflow-hidden">
                            <div class="bg-slate-900 text-white px-3 py-2 text-xs font-bold flex justify-between items-center">
                                <span>🛡️ 가드 영역 (40점 만점 / 기본 20점)</span>
                            </div>
                            <div class="p-2 bg-slate-50 text-[11px] space-y-1">
                                <div class="flex justify-between p-1 bg-white rounded"><span>A등급 : 4개 배치</span><span class="font-bold text-teal-600">40점</span></div>
                                <div class="flex justify-between p-1 bg-white rounded"><span>B등급 : 3개 배치</span><span class="font-bold text-slate-700">35점</span></div>
                                <div class="flex justify-between p-1 bg-white rounded"><span>C등급 : 2개 배치</span><span class="font-bold text-slate-700">30점</span></div>
                                <div class="flex justify-between p-1 bg-white rounded"><span>D등급 : 1개 배치</span><span class="font-bold text-slate-700">25점</span></div>
                                <div class="flex justify-between p-1 bg-white rounded"><span>E등급 : 0개 성공 (기본)</span><span class="font-bold text-slate-400">20점</span></div>
                            </div>
                        </div>

                        <div class="border border-slate-200 rounded-xl overflow-hidden">

        function renderPractice(cur, rData) {
            const unlockedRounds = state.dbData.unlockedRounds || [true, false, false, false, false];
            const rIdx = state.selectedRound - 1;

            const val = rData.records[state.activeTab] ? rData.records[state.activeTab][rIdx] : -1;
            const hasChosen = val >= 0;
            const displayVal = hasChosen ? val : 0;
            
            const score = hasChosen 
                ? (state.activeTab==='draw'?calcDrawScore(val):state.activeTab==='guard'?calcGuardScore(val):calcTakeoutScore(val))
                : 0;

            let maxScore = 40;
            let maxCount = 4;
            let tabTitle = "🎯 스톤 드로우";
            let tabDesc = "스톤을 티와 버튼 안에 정확히 안착시키세요.";

            if (state.activeTab === 'guard') {
                maxScore = 40; maxCount = 4;
                tabTitle = "🛡️ 수비 가드";
                tabDesc = "티 앞쪽 공간에 수비 스톤을 배치하세요.";
            } else if (state.activeTab === 'takeout') {
                maxScore = 20; maxCount = 3;
                tabTitle = "💥 테이크 아웃";
                tabDesc = "버튼에 있는 스톤을 밖으로 밀어내세요 (최대 3개).";
            }

            return `
                <div class="space-y-4">
                    <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200/85 space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-[11px] font-bold text-slate-700">수업 차시 선택</span>
                            <span class="text-[10px] text-slate-400">🔒 표시는 교사 잠금 상태</span>
                        </div>
                        <div class="grid grid-cols-5 gap-1.5">
                            ${[1,2,3,4,5].map((roundNum, idx) => {

                                const isSelected = state.selectedRound === roundNum;
                                return `
                                    <button onclick="selectRound(${roundNum})" class="py-2.5 rounded-xl text-xs font-bold border transition ${isSelected ? 'bg-slate-900 text-white border-slate-900' : (unlocked ? 'bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200' : 'bg-slate-100 text-slate-400 border-slate-200 opacity-60')}">
                                        ${roundNum}차시 ${!unlocked ? '🔒' : ''}
                                    </button>
                                `;
                            }).join('')}

                    </div>

                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/80 space-y-4 text-center">
                        <div>
                            <span class="text-[11px] font-bold text-teal-600 bg-teal-50 px-3 py-1 rounded-full border border-teal-200">${tabTitle}</span>
                            <h3 class="text-base font-bold text-slate-900 mt-2">${tabDesc}</h3>
                        </div>

                        <!-- 🌟 플러스 마이너스 조절 UI 영역 -->
                        <div class="py-2 bg-slate-50 p-4 rounded-2xl border border-slate-100 space-y-3">
                            <div class="text-[11px] text-slate-400 font-medium">성공 횟수 입력 (범위: -1 ~ ${maxCount})</div>
                            
                            <div class="flex items-center justify-center space-x-4">
                                <button onclick="adjustScore(-1)" class="btn-chic w-12 h-12 rounded-2xl bg-slate-200 hover:bg-slate-300 text-slate-800 text-xl font-black shadow-sm flex items-center justify-center">-</button>
                                
                                <div class="text-center min-w-[110px]">
                                    <div class="text-3xl font-black text-slate-900">${hasChosen ? displayVal + '<span class="text-sm font-normal text-slate-500 ml-0.5">개</span>' : '<span class="text-slate-400 text-sm font-bold">미입력</span>'}</div>
                                    <div class="text-[10px] font-bold text-teal-600 mt-0.5">${hasChosen ? score + '점 / ' + maxScore + '점 만점' : '(-1) 점수 미반영'}</div>
                                </div>

                                <button onclick="adjustScore(1)" class="btn-chic w-12 h-12 rounded-2xl bg-teal-500 hover:bg-teal-400 text-slate-950 text-xl font-black shadow-sm flex items-center justify-center">+</button>
                            </div>
                        </div>

                        <div class="pt-2 border-t border-slate-100">
                            ${rData.approved 
                                ? `<div class="w-full bg-teal-50 text-teal-700 font-bold py-3 rounded-xl text-xs border border-teal-200">✅ 선생님 승인 완료된 차시입니다.</div>`
                                : (rData.submitted 
                                    ? `
                                        <div class="space-y-2">
                                            <div class="w-full bg-sky-50 text-sky-700 font-bold py-2 rounded-xl text-xs border border-sky-200">⏳ 선생님 확인 대기 중</div>
                                            <button onclick="cancelSubmitRound()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition shadow">제출 취소하고 수정하기</button>
                                        </div>
                                      `
                                    : `<button onclick="submitRound()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl text-xs transition shadow">📤 [ ${state.selectedRound}차시 ] 모든 항목 최종 제출하기</button>`)

        function selectRound(rNum) {
            state.selectedRound = rNum;
            render();
        }

        // 플러스 마이너스 버튼 조절 함수 (-1 ~ maxCount)
        function adjustScore(amount) {
            const classStudents = (state.dbData.classes && state.dbData.classes[state.selectedClass]) || [];
            const cur = classStudents.find(s => Number(s.number) === Number(state.student.number));
            if (!cur) return;

            const rKey = 'round_' + state.selectedRound;
            if (!cur.rounds[rKey]) {
                cur.rounds[rKey] = {
                    submitted: false,
                    approved: false,
                    records: { draw: [-1,-1,-1,-1,-1], guard: [-1,-1,-1,-1,-1], takeout: [-1,-1,-1,-1,-1] }
                };
            }
            const rData = cur.rounds[rKey];

            if (rData.approved) {
                alert("선생님이 이미 승인한 차시입니다. 수정이 필요한 경우 교사 모니터링 화면에서 직접 수정하실 수 있습니다!");
                return;
            }
            if (rData.submitted) {
                alert("이미 제출된 차시입니다. 수정하려면 아래 '제출 취소하고 수정하기' 버튼을 눌러주세요.");
                return;
            }

            if (!rData.records[state.activeTab]) {
                rData.records[state.activeTab] = [-1,-1,-1,-1,-1];
            }

            let currentVal = rData.records[state.activeTab][state.selectedRound - 1];
            if (currentVal === undefined || currentVal === null) currentVal = -1;

            const maxCount = state.activeTab === 'takeout' ? 3 : 4;
            let newVal = currentVal + amount;

            // 범위 제한 (-1 ~ maxCount)
            if (newVal < -1) newVal = -1;
            if (newVal > maxCount) newVal = maxCount;

            rData.records[state.activeTab][state.selectedRound - 1] = newVal;
            
            if (dbRef) {
                dbRef.child('classes/' + state.selectedClass).set(classStudents);
            }
            render();
        }

        function submitRound() {
            const classStudents = (state.dbData.classes && state.dbData.classes[state.selectedClass]) || [];
            const cur = classStudents.find(s => Number(s.number) === Number(state.student.number));
            if (!cur) return;

            const rKey = 'round_' + state.selectedRound;
            cur.rounds[rKey].submitted = true;
            
            if (dbRef) {
                dbRef.child('classes/' + state.selectedClass).set(classStudents);
            }
            alert(`${state.selectedRound}차시의 모든 항목 점수가 안전하게 제출되었습니다!`);
            render();
        }

        function cancelSubmitRound() {
            const classStudents = (state.dbData.classes && state.dbData.classes[state.selectedClass]) || [];
            const cur = classStudents.find(s => Number(s.number) === Number(state.student.number));
            if (!cur) return;

            const rKey = 'round_' + state.selectedRound;
            if (cur.rounds[rKey].approved) {
                alert("이미 승인된 항목입니다.");
                return;
            }
            cur.rounds[rKey].submitted = false;
            
            if (dbRef) {
                dbRef.child('classes/' + state.selectedClass).set(classStudents);
            }
            alert("제출이 취소되었습니다. 이제 점수를 수정할 수 있습니다.");
            render();
        }

            return `

                        <button onclick="state.teacherSubTab='classRank'; render();" class="flex-1 py-2 px-2 rounded-lg transition min-w-[80px] ${state.teacherSubTab==='classRank'?'bg-teal-500 text-slate-950 font-bold':'text-slate-400 hover:text-white'}">🏫 반별누적조회</button>
                        <button onclick="state.teacherSubTab='roundRank'; render();" class="flex-1 py-2 px-2 rounded-lg transition min-w-[80px] ${state.teacherSubTab==='roundRank'?'bg-teal-500 text-slate-950 font-bold':'text-slate-400 hover:text-white'}">🏫 반별차시순위</button>
                        <button onclick="state.teacherSubTab='totalRank'; render();" class="flex-1 py-2 px-2 rounded-lg transition min-w-[80px] ${state.teacherSubTab==='totalRank'?'bg-teal-500 text-slate-950 font-bold':'text-slate-400 hover:text-white'}">🏆 전교생랭킹</button>
                        <button onclick="state.teacherSubTab='settings'; render();" class="flex-1 py-2 px-2 rounded-lg transition min-w-[50px] ${state.teacherSubTab==='settings'?'bg-teal-500 text-slate-950 font-bold':'text-slate-400 hover:text-white'}">⚙️ 설정</button>

        function renderTeacherClassRankView() {
            let list = [];
            const classes = state.dbData.classes || {};
            const cNum = state.teacherRankClass || 1;
            const stds = classes[cNum] || [];

            stds.forEach(s => {
                const cumulativeScore = getTotalCumulativeScore(s);
                if (cumulativeScore > 0 || (s.rounds && Object.keys(s.rounds).length > 0)) {
                    const avObj = AVATARS.find(a => a.id === s.avatar) || AVATARS[0];
                    list.push({
                        number: s.number, name: s.name, avatarIcon: avObj.icon,
                        score: cumulativeScore
                    });
                }
            });

            list.sort((a,b) => b.score - a.score);

            return `
                <div class="space-y-4">
                    <div class="bg-slate-800 p-3.5 rounded-xl border border-slate-700 flex justify-between items-center">
                        <span class="text-xs font-bold text-teal-400">🏫 학급별 누적 총점 랭킹</span>
                        <select class="bg-slate-900 text-white font-bold p-2 rounded-lg border border-slate-700 text-xs" onchange="state.teacherRankClass=Number(this.value); render();">
                            ${[1,2,3,4,5,6,7,8,9].map(c => `<option value="${c}" ${c===state.teacherRankClass?'selected':''}>1학년 ${c}반</option>`).join('')}
                        </select>
                    </div>

                    <div class="space-y-2 max-h-[380px] overflow-y-auto pr-1">
                        ${list.length === 0 ? `<div class="text-center py-12 text-xs text-slate-500">1학년 ${cNum}반에 등록된 학생 기록이 없습니다.</div>` : ''}
                        ${list.map((st, i) => `
                            <div class="bg-slate-800 p-3.5 rounded-xl flex justify-between items-center border border-slate-700">
                                <div class="flex items-center space-x-3">
                                    <span class="w-6 h-6 rounded-md flex items-center justify-center text-xs font-bold ${i===0?'bg-amber-400 text-slate-950':i===1?'bg-slate-300 text-slate-800':i===2?'bg-amber-700 text-white':'bg-slate-900 text-slate-400 border border-slate-700'}">
                                        ${i+1}
                                    </span>
                                    <span class="text-xs font-medium text-white">${st.avatarIcon} ${st.number}번 ${st.name}</span>
                                </div>
                                <span class="font-bold text-sm text-teal-400">${st.score}점</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderTeacherRoundRankView() {
            let list = [];
            const classes = state.dbData.classes || {};
            const cNum = state.teacherRoundRankClass || 1;
            const rNum = state.teacherRoundRankNum || 1;
            const stds = classes[cNum] || [];

            stds.forEach(s => {
                if (s.rounds) {
                    const rKey = 'round_' + rNum;
                    const rData = s.rounds[rKey];
                    if (rData && (rData.approved || rData.submitted)) {
                        const roundScore = getRoundScore(rData, rNum - 1);
                        const avObj = AVATARS.find(a => a.id === s.avatar) || AVATARS[0];
                        list.push({
                            number: s.number, name: s.name, avatarIcon: avObj.icon,
                            score: roundScore
                        });
                    }
                }
            });

            list.sort((a,b) => b.score - a.score);

            return `
                <div class="space-y-4">
                    <div class="bg-slate-800 p-3.5 rounded-xl border border-slate-700 flex justify-between items-center gap-2">
                        <div>
                            <label class="text-[10px] text-slate-400 block mb-1">학급 선택</label>
                            <select class="bg-slate-900 text-white font-bold p-2 rounded-lg border border-slate-700 text-xs" onchange="state.teacherRoundRankClass=Number(this.value); render();">
                                ${[1,2,3,4,5,6,7,8,9].map(c => `<option value="${c}" ${c===state.teacherRoundRankClass?'selected':''}>1학년 ${c}반</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-400 block mb-1">차시 선택</label>
                            <select class="bg-slate-900 text-white font-bold p-2 rounded-lg border border-slate-700 text-xs" onchange="state.teacherRoundRankNum=Number(this.value); render();">
                                ${[1,2,3,4,5].map(r => `<option value="${r}" ${r===state.teacherRoundRankNum?'selected':''}>${r}차시</option>`).join('')}
                            </select>
                        </div>
                    </div>

                    <div class="space-y-2 max-h-[380px] overflow-y-auto pr-1">
                        ${list.length === 0 ? `<div class="text-center py-12 text-xs text-slate-500">1학년 ${cNum}반 ${rNum}차시 제출/승인된 기록이 없습니다.</div>` : ''}
                        ${list.map((st, i) => `
                            <div class="bg-slate-800 p-3.5 rounded-xl flex justify-between items-center border border-slate-700">
                                <div class="flex items-center space-x-3">
                                    <span class="w-6 h-6 rounded-md flex items-center justify-center text-xs font-bold ${i===0?'bg-amber-400 text-slate-950':i===1?'bg-slate-300 text-slate-800':i===2?'bg-amber-700 text-white':'bg-slate-900 text-slate-400 border border-slate-700'}">
                                        ${i+1}
                                    </span>
                                    <span class="text-xs font-medium text-white">${st.avatarIcon} ${st.number}번 ${st.name}</span>
                                </div>
                                <span class="font-bold text-sm text-sky-400">${st.score}점</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderTeacherTotalRankView() {
            let list = [];
            const classes = state.dbData.classes || {};
            
            Object.keys(classes).forEach(cKey => {
                const stds = classes[cKey];
                stds.forEach(s => {
                    const cumulativeScore = getTotalCumulativeScore(s);
                    if (cumulativeScore > 0) {
                        const avObj = AVATARS.find(a => a.id === s.avatar) || AVATARS[0];
                        list.push({
                            className: cKey, number: s.number, name: s.name, avatarIcon: avObj.icon,
                            score: cumulativeScore
                        });
                    }
                });
            });

            list.sort((a,b) => b.score - a.score);

            return `
                <div class="space-y-4">
                    <div class="bg-slate-800 p-3.5 rounded-xl border border-slate-700 text-center">
                        <h3 class="text-xs font-bold text-teal-400">🏆 1학년 전교생 전체 누적 총점 랭킹</h3>
                        <p class="text-[10px] text-slate-400 mt-0.5">전체 학생의 누적 점수 순위 (인원 제한 없음)</p>
                    </div>

                    <div class="space-y-2 max-h-[380px] overflow-y-auto pr-1">
                        ${list.length === 0 ? `<div class="text-center py-12 text-xs text-slate-500">등록된 누적 기록이 없습니다.</div>` : ''}
                        ${list.map((st, i) => `
                            <div class="bg-slate-800 p-3.5 rounded-xl flex justify-between items-center border border-slate-700">
                                <div class="flex items-center space-x-3">
                                    <span class="w-6 h-6 rounded-md flex items-center justify-center text-xs font-bold ${i===0?'bg-amber-400 text-slate-950':i===1?'bg-slate-300 text-slate-800':i===2?'bg-amber-700 text-white':'bg-slate-900 text-slate-400 border border-slate-700'}">
                                        ${i+1}
                                    </span>
                                    <span class="text-xs font-medium text-white">${st.avatarIcon} 1학년 ${st.className}반 ${st.number}번 ${st.name}</span>
                                </div>
                                <span class="font-bold text-sm text-teal-400">${st.score}점</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderTeacherMonitor() {
            const classStudents = (state.dbData.classes && state.dbData.classes[state.selectedClass]) || [];
            classStudents.sort((a,b) => Number(a.number) - Number(b.number));
            const rIdx = state.selectedRound - 1;

            return `
                <div class="space-y-4">
                    <div class="bg-slate-800 p-3.5 rounded-xl border border-slate-700 flex justify-between items-center">
                        <div>
                            <label class="text-[10px] text-slate-400 block mb-1">조회할 학급</label>
                            <select class="bg-slate-900 text-white font-bold p-2 rounded-lg border border-slate-700 text-xs" onchange="state.selectedClass=Number(this.value); render();">
                                ${[1,2,3,4,5,6,7,8,9].map(c => `<option value="${c}" ${c===state.selectedClass?'selected':''}>1학년 ${c}반</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-400 block mb-1">조회할 차시</label>
                            <select class="bg-slate-900 text-white font-bold p-2 rounded-lg border border-slate-700 text-xs" onchange="state.selectedRound=Number(this.value); render();">
                                ${[1,2,3,4,5].map(r => `<option value="${r}" ${r===state.selectedRound?'selected':''}>${r}차시</option>`).join('')}
                            </select>
                        </div>
                    </div>

                    <div class="space-y-3 max-h-[380px] overflow-y-auto pr-1">
                        ${classStudents.length === 0 ? `<div class="text-center py-12 text-xs text-slate-500">등록된 학생이 없습니다.</div>` : ''}
                        ${classStudents.map(s => {
                            const rKey = 'round_' + state.selectedRound;
                            if (!s.rounds || !s.rounds[rKey]) {
                                s.rounds = s.rounds || {};
                                s.rounds[rKey] = { submitted: false, approved: false, records: { draw: [-1,-1,-1,-1,-1], guard: [-1,-1,-1,-1,-1], takeout: [-1,-1,-1,-1,-1] } };
                            }
                            const rData = s.rounds[rKey];
                            const dVal = rData.records.draw ? rData.records.draw[rIdx] : -1;
                            const gVal = rData.records.guard ? rData.records.guard[rIdx] : -1;
                            const tVal = rData.records.takeout ? rData.records.takeout[rIdx] : -1;

                            const sD = calcDrawScore(dVal);
                            const sG = calcGuardScore(gVal);
                            const sT = calcTakeoutScore(tVal);
                            const totalScore = getRoundScore(rData, rIdx);

                            const avObj = AVATARS.find(a => a.id === s.avatar) || AVATARS[0];

                            return `
                                <div class="bg-slate-800/90 p-3.5 rounded-xl border border-slate-700 space-y-2.5">
                                    <div class="flex justify-between items-center">
                                        <div class="flex items-center space-x-2.5">
                                            <span class="text-base">${avObj.icon}</span>
                                            <div>
                                                <div class="text-xs font-bold text-white">${s.number}번 ${s.name}</div>
                                                <div class="text-[10px] text-teal-400 font-bold mt-0.5">차시 총점: ${totalScore}점</div>
                                            </div>
                                        </div>
                                        <div class="flex items-center space-x-1.5">
                                            ${rData.approved 
                                                ? `<button onclick="teacherToggleApprove(${s.number}, false)" class="bg-teal-500/20 text-teal-300 border border-teal-500/40 text-[10px] font-bold px-2.5 py-1.5 rounded-lg">승인완료(취소)</button>`
                                                : (rData.submitted 
                                                    ? `<button onclick="teacherToggleApprove(${s.number}, true)" class="bg-sky-500 hover:bg-sky-400 text-slate-950 text-[10px] font-bold px-2.5 py-1.5 rounded-lg transition">승인하기</button>`
                                                    : `<span class="text-[10px] text-slate-500">수행중</span>`)
                                            }
                                            <button onclick="teacherDeleteStudent(${s.number})" class="text-slate-500 hover:text-red-400 p-1 text-xs">🗑️</button>
                                        </div>
                                    </div>

                                    <div class="grid grid-cols-3 gap-1.5 pt-2 border-t border-slate-700/60 text-[11px]">
                                        <div onclick="teacherQuickEdit(${s.number}, 'draw')" class="bg-slate-900/80 p-2 rounded-lg border border-slate-700 text-center cursor-pointer hover:border-teal-400 transition" title="클릭하여 수정">
                                            <div class="text-slate-400 text-[10px]">🎯 드로우</div>
                                            <div class="font-bold text-teal-300 mt-0.5">${dVal>=0 ? dVal+'개 ('+sD+'점)' : '<span class="text-slate-500 font-normal">미입력(-)</span>'}</div>
                                        </div>
                                        <div onclick="teacherQuickEdit(${s.number}, 'guard')" class="bg-slate-900/80 p-2 rounded-lg border border-slate-700 text-center cursor-pointer hover:border-teal-400 transition" title="클릭하여 수정">
                                            <div class="text-slate-400 text-[10px]">🛡️ 가드</div>
                                            <div class="font-bold text-teal-300 mt-0.5">${gVal>=0 ? gVal+'개 ('+sG+'점)' : '<span class="text-slate-500 font-normal">미입력(-)</span>'}</div>
                                        </div>
                                        <div onclick="teacherQuickEdit(${s.number}, 'takeout')" class="bg-slate-900/80 p-2 rounded-lg border border-slate-700 text-center cursor-pointer hover:border-teal-400 transition" title="클릭하여 수정">
                                            <div class="text-slate-400 text-[10px]">💥 테이크</div>
                                            <div class="font-bold text-teal-300 mt-0.5">${tVal>=0 ? tVal+'개 ('+sT+'점)' : '<span class="text-slate-500 font-normal">미입력(-)</span>'}</div>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function teacherQuickEdit(num, category) {
            const classStudents = (state.dbData.classes && state.dbData.classes[state.selectedClass]) || [];
            const target = classStudents.find(s => Number(s.number) === Number(num));
            if (!target) return;

            const rKey = 'round_' + state.selectedRound;
            if (!target.rounds[rKey]) {
                target.rounds[rKey] = {
                    submitted: false,
                    approved: false,
                    records: { draw: [-1,-1,-1,-1,-1], guard: [-1,-1,-1,-1,-1], takeout: [-1,-1,-1,-1,-1] }
                };
            }
            const rData = target.rounds[rKey];
            const maxCnt = category === 'takeout' ? 3 : 4;

            const inputStr = prompt(`${target.number}번 ${target.name} 학생의 [ ${state.selectedRound}차시 - ${category === 'draw' ? '드로우' : category === 'guard' ? '가드' : '테이크아웃'} ] 성공 개수를 입력하세요 (미입력은 -1, 0~${maxCnt}):`);
            if (inputStr === null) return;

            const cnt = Number(inputStr);
            if (isNaN(cnt) || cnt < -1 || cnt > maxCnt) {
                alert(`-1(미입력) 또는 0부터 ${maxCnt} 사이의 숫자를 입력해주세요.`);
                return;
            }

            if (!rData.records[category]) {
                rData.records[category] = [-1,-1,-1,-1,-1];
            }
            rData.records[category][state.selectedRound - 1] = cnt;

            if (dbRef) {
                dbRef.child('classes/' + state.selectedClass).set(classStudents);
            }
            render();
        }

        function renderTeacherSettings() {
            const unlocked = state.dbData.unlockedRounds || [true, false, false, false, false];
            return `
                <div class="space-y-4">
                    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
                        <h3 class="text-xs font-bold text-teal-400">🔓 차시별 학생 접근 잠금 해제</h3>
                        <div class="space-y-2">
                            ${[1,2,3,4,5].map((rNum, idx) => `
                                <div class="flex justify-between items-center bg-slate-900 p-2.5 rounded-lg border border-slate-700">
                                    <span class="text-xs font-medium">${rNum}차시 평가 화면</span>
                                    <button onclick="toggleRoundUnlock(${idx})" class="px-3 py-1 rounded-md text-xs font-bold ${unlocked[idx]?'bg-teal-500 text-slate-950':'bg-slate-800 text-slate-400 border border-slate-700'}">
                                        ${unlocked[idx] ? '🔓 해제됨 (입력가능)' : '🔒 잠김'}
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
                        <h3 class="text-xs font-bold text-teal-400">🔑 교사 관리자 비밀번호 변경</h3>
                        <div class="flex gap-2">
                            <input type="password" id="new-pwd-input" placeholder="새 비밀번호 4자리" class="flex-grow p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white">
                            <button onclick="changeTeacherPwd()" class="bg-teal-500 text-slate-950 font-bold px-4 py-2.5 rounded-lg text-xs">변경</button>
                        </div>
                    </div>

                    <div class="bg-slate-800 p-4 rounded-xl border border-red-500/30 space-y-3">
                        <h3 class="text-xs font-bold text-red-400">⚠️ 위험 구역 (데이터 초기화)</h3>
                        <p class="text-[11px] text-slate-400">주머니 속 오작동 방지를 위해 비밀번호 입력 후에만 초기화됩니다.</p>
                        <button onclick="safeResetData()" class="w-full bg-red-500/20 hover:bg-red-500/30 text-red-300 border border-red-500/40 font-bold py-2.5 rounded-xl text-xs transition">
                            🚨 전체 데이터베이스 초기화
                        </button>
                    </div>
                </div>
            `;
        }

        function teacherToggleApprove(num, approveVal) {
            const classStudents = (state.dbData.classes && state.dbData.classes[state.selectedClass]) || [];
            const target = classStudents.find(s => Number(s.number) === Number(num));
            if (target) {
                const rKey = 'round_' + state.selectedRound;
                if (target.rounds && target.rounds[rKey]) {
                    target.rounds[rKey].approved = approveVal;
                    if (dbRef) {
                        dbRef.child('classes/' + state.selectedClass).set(classStudents);
                    }
                    render();
                }
            }
        }

        function teacherDeleteStudent(num) {
            if (confirm(`${num}번 학생의 데이터를 삭제하시겠습니까?`)) {
                let classStudents = (state.dbData.classes && state.dbData.classes[state.selectedClass]) || [];
                state.dbData.classes[state.selectedClass] = classStudents.filter(s => Number(s.number) !== Number(num));
                if (dbRef) {
                    dbRef.child('classes/' + state.selectedClass).set(state.dbData.classes[state.selectedClass]);
                }
                render();
            }
        }

        function toggleRoundUnlock(idx) {
            if (!state.dbData.unlockedRounds) state.dbData.unlockedRounds = [true, false, false, false, false];
            state.dbData.unlockedRounds[idx] = !state.dbData.unlockedRounds[idx];
            if (dbRef) {
                dbRef.child('unlockedRounds').set(state.dbData.unlockedRounds);
            }
            render();
        }

        function changeTeacherPwd() {
            const val = document.getElementById('new-pwd-input').value.trim();
            if (val.length < 2) {
                alert('비밀번호를 올바르게 입력해주세요.');
                return;
            }
            state.dbData.teacherPwd = val;
            if (dbRef) {
                dbRef.child('teacherPwd').set(val);
            }
            alert('교사 관리자 비밀번호가 변경되었습니다!');
            document.getElementById('new-pwd-input').value = '';
        }

        function safeResetData() {
            const pwd = prompt("데이터를 완전히 초기화하려면 관리자 비밀번호를 입력하세요:");
            const currentPwd = state.dbData.teacherPwd || "0000";
            if (pwd === currentPwd) {
                if (confirm("정말 모든 학생 기록을 초기화하시겠습니까? 이 작업은 되돌릴 수 없습니다.")) {
                    state.dbData = { classes: {}, unlockedRounds: [true, false, false, false, false], teacherPwd: currentPwd };
                    pushDb();
                    alert("모든 데이터가 초기화되었습니다.");
                    render();
                }
            } else if (pwd !== null) {
                alert("비밀번호가 틀렸습니다. 초기화가 취소됩니다.");
            }
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
